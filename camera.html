<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRスキャナー</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      width: 100vw; height: 100vh;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    #video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    canvas { display: none; }

    /* スキャン枠オーバーレイ */
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none;
    }
    #scan-frame {
      width: 200px; height: 200px;
      border: 3px solid #34a853;
      border-radius: 10px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
      position: relative;
    }
    /* 四隅のコーナー強調 */
    #scan-frame::before, #scan-frame::after,
    #corner-bl, #corner-br {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      border-color: #34a853;
      border-style: solid;
    }
    #scan-frame::before { top: -3px; left: -3px; border-width: 4px 0 0 4px; border-radius: 4px 0 0 0; }
    #scan-frame::after  { top: -3px; right: -3px; border-width: 4px 4px 0 0; border-radius: 0 4px 0 0; }
    #corner-bl { bottom: -3px; left: -3px; border-width: 0 0 4px 4px; border-radius: 0 0 0 4px; }
    #corner-br { bottom: -3px; right: -3px; border-width: 0 4px 4px 0; border-radius: 0 0 4px 0; }

    /* スキャンライン */
    #scan-line {
      position: absolute; left: 0; right: 0; top: 0;
      height: 2px;
      background: linear-gradient(to right, transparent, #34a853, transparent);
      animation: scanMove 1.8s ease-in-out infinite;
    }
    @keyframes scanMove {
      0%   { top: 0%; opacity: 1; }
      90%  { top: 100%; opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    #status-label {
      margin-top: 20px;
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      font-family: sans-serif;
      background: rgba(0,0,0,0.55);
      padding: 5px 14px;
      border-radius: 20px;
      letter-spacing: 0.03em;
    }

    /* 読み取り成功フラッシュ */
    #found-flash {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #34a853;
      color: white;
      font-size: 52px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      padding: 24px 48px;
      border-radius: 16px;
      letter-spacing: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      z-index: 100;
      animation: popIn 0.15s ease-out;
    }
    @keyframes popIn {
      from { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
      to   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
    }

    /* エラー表示 */
    #error-msg {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #d93025;
      color: white;
      font-size: 15px;
      font-family: sans-serif;
      padding: 20px 28px;
      border-radius: 12px;
      text-align: center;
      max-width: 80%;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="overlay">
    <div id="scan-frame">
      <div id="scan-line"></div>
      <div id="corner-bl"></div>
      <div id="corner-br"></div>
    </div>
    <div id="status-label">QRコードをかざしてください</div>
  </div>

  <div id="found-flash"></div>
  <div id="error-msg"></div>

  <script>
    let scanning = true;

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    })
    .then(function(stream) {
      let v = document.getElementById('video');
      v.srcObject = stream;
      v.play();
      requestAnimationFrame(tick);
    })
    .catch(function(err) {
      let errNames = {
        'NotAllowedError':   'カメラの使用が拒否されています。\nブラウザのアドレスバーからカメラを「許可」にしてください。',
        'NotFoundError':     'カメラが見つかりません。\nカメラが接続されているか確認してください。',
        'NotReadableError':  'カメラが他のアプリに使用中です。\nZoomやTeamsなどを閉じてください。'
      };
      let msg = errNames[err.name] || ('カメラエラー: ' + err.name);
      let el = document.getElementById('error-msg');
      el.innerText = msg;
      el.style.display = 'block';
      document.getElementById('status-label').style.display = 'none';
    });

    function tick() {
      if (!scanning) return;
      let v = document.getElementById('video');
      let c = document.getElementById('canvas');
      if (v.readyState === v.HAVE_ENOUGH_DATA) {
        c.width  = v.videoWidth;
        c.height = v.videoHeight;
        let ctx = c.getContext('2d');
        ctx.drawImage(v, 0, 0, c.width, c.height);
        let img  = ctx.getImageData(0, 0, c.width, c.height);
        let code = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
        if (code) {
          let num = code.data.trim();
          if (/^\d{4}$/.test(num)) {
            scanning = false;

            // フラッシュ表示
            let flash = document.getElementById('found-flash');
            flash.innerText = num;
            flash.style.display = 'block';
            document.getElementById('status-label').innerText = '照合中...';

            // 親ページへ送信
            window.parent.postMessage({ type: 'QR_SCANNED', num: num }, '*');

            // 1.5秒後に再スキャン
            setTimeout(function() {
              flash.style.display = 'none';
              document.getElementById('status-label').innerText = 'QRコードをかざしてください';
              scanning = true;
              requestAnimationFrame(tick);
            }, 1500);
            return;
          }
        }
      }
      requestAnimationFrame(tick);
    }
  </script>
</body>
</html>
